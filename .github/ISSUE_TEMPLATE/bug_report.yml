name: Reproducible problem
description: Report an observed software, data or research issue
body:
  - type: textarea
    attributes:
      label: Observed behavior
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduce
      description: Exact command, software revision, OS, Python and data/config fingerprints. Do not attach private recordings or credentials.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Evidence
      description: Relevant error, failed check or small consented example.
