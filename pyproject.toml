[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostmesh"
version = "0.1.0"
description = "Reproducible, uncertainty-aware temporal Wi-Fi CSI to 2D pose research"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT AND CC-BY-NC-4.0"
license-files = ["LICENSE", "NOTICE.md", "data/LICENSE.md"]
dependencies = ["numpy==2.2.6", "scipy==1.16.3", "torch==2.9.0"]

[project.optional-dependencies]
test = ["pytest==8.4.2"]
hardware = ["pyserial==3.5"]

[project.scripts]
ghostmesh = "ghostmesh.cli:main"

[project.urls]
Source = "https://github.com/nazeeh111/GhostMesh"
Issues = "https://github.com/nazeeh111/GhostMesh/issues"

[tool.setuptools]
packages = ["ghostmesh"]
include-package-data = true

[tool.setuptools.package-data]
ghostmesh = ["web/*", "examples/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'"}]
